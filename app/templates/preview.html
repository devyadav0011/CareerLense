{% extends "base.html" %}

{% block title %}Resume Preview &amp; Print — CareerLense{% endblock %}

{% block content %}
<div class="py-8 bg-slate-100 dark:bg-slate-950 min-h-[calc(100vh-4rem)]">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
        
        <!-- Controls Bar -->
        <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <a href="{{ url_for('main.builder') }}" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="w-8 h-8 rounded-lg bg-white p-0.5 shadow-xs border border-slate-200 dark:border-slate-700 shrink-0 flex items-center justify-center">
                    <img src="{{ icon_path }}" alt="CareerLense" class="w-full h-full object-contain">
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 dark:text-white">Print-Ready Resume Preview</h1>
                    <span class="text-xs text-slate-400">Formatted for standard A4 document boundaries</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2.5">
                <button onclick="window.print()" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all flex items-center gap-1.5">
                    <i data-lucide="printer" class="w-3.5 h-3.5"></i> Print
                </button>
                <a href="/api/export/resume" class="px-4 py-2 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-500 shadow-sm transition-all flex items-center gap-1.5">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Download PDF
                </a>
            </div>
        </div>

        <!-- Sheet Display -->
        <div class="p-4 sm:p-8 bg-slate-300/40 dark:bg-slate-900/60 rounded-3xl border border-slate-200 dark:border-slate-800 flex justify-center">
            <div id="standalonePreviewContainer" class="w-full max-w-[800px]">
                <!-- Dynamically loaded preview -->
                <div class="text-center p-12 text-slate-400">Loading resume preview...</div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/api/resume/current');
            const data = await res.json();
            const container = document.getElementById('standalonePreviewContainer');

            if (data.resume && data.resume.structured_data) {
                const sheet = document.createElement('div');
                sheet.className = 'resume-preview-sheet template-modern max-w-[800px] mx-auto text-xs leading-relaxed';
                sheet.id = 'resumePreviewSheet';
                container.innerHTML = '';
                container.appendChild(sheet);

                // Load builder renderer logic
                const script = document.createElement('script');
                script.src = "{{ url_for('static', filename='js/builder.js') }}";
                document.body.appendChild(script);
            } else {
                container.innerHTML = `
                    <div class="p-8 rounded-2xl bg-white dark:bg-slate-900 text-center space-y-3">
                        <i data-lucide="file-question" class="w-10 h-10 text-slate-400 mx-auto"></i>
                        <h3 class="font-bold text-sm text-slate-800 dark:text-slate-200">No Resume Detected in Current Session</h3>
                        <p class="text-xs text-slate-500">Please build a resume or upload one to generate a print-ready preview.</p>
                        <a href="/builder" class="inline-flex px-4 py-2 rounded-xl bg-brand-600 text-white font-bold text-xs">Open Resume Builder</a>
                    </div>
                `;
                if (window.lucide) window.lucide.createIcons();
            }
        } catch (e) {}
    });
</script>
{% endblock %}
